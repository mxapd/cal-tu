[package]
name = "cal-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cal-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = "0.4.45"
chrono-tz = "0.10.4"
ratatui = "0.30.2"
notify-rust = "4.19.0"
clap_complete = "4.6.11"
ureq = { version = "3.5.2", features = ["json"] }
tiny_http = { version = "0.12.0", optional = true }

[features]
default = ["jarvis"]
# Jarvis integration: `serve`, `report`, and the journal after a sync.
# Without it (--no-default-features) cal-tui is the TUI and the shell
# commands only.
jarvis = ["dep:tiny_http"]

[dev-dependencies]
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }
tempfile = "3.27.0"
toml = "1.2.1"
